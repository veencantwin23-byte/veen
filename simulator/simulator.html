<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drone Simulator</title>
    <style>
      body {
        margin: 0;
        background: #07131f;
        color: white;
        font-family: Arial, sans-serif;
      }
      .sim-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .card {
        border: 1px solid rgba(0,229,255,0.3);
        border-radius: 18px;
        padding: 32px;
        background: rgba(255,255,255,0.04);
      }
    </style>
  </head>
  <body>
    <div class="sim-shell">
      <div class="card">
        <h1>Drone Simulator</h1>
        <p>Simulator scaffold ready for the flight logic implementation.</p>
      </div>
    </div>
  </body>
</html>
