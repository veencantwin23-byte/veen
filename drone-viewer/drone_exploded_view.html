<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drone Viewer</title>
    <style>
      body {
        margin: 0;
        background: #04070a;
        color: white;
        font-family: Arial, sans-serif;
      }
      .viewer {
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
      }
      .placeholder {
        border: 1px solid rgba(0,229,255,0.3);
        border-radius: 16px;
        padding: 18px 24px;
        background: rgba(255,255,255,0.04);
      }
    </style>
  </head>
  <body>
    <div class="viewer">
      <div class="placeholder">3D Drone Viewer Placeholder</div>
    </div>
  </body>
</html>
